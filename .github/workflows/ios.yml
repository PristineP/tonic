name: iOS

on:
  push:
    branches-ignore: [ci-screenshots]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list devices available | head -40

      - name: Core unit tests
        run: swift test --package-path HiChordCore

      - name: Build (Release, device, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project HiChord.xcodeproj -scheme HiChord -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-device.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build-device.log

      - name: Build (Debug, simulator)
        run: |
          set -o pipefail
          xcodebuild -project HiChord.xcodeproj -scheme HiChord -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-sim.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build-sim.log

      # Screenshots are a visual check; simulator boot on hosted runners is occasionally broken,
      # so this step never fails the build (tests and both builds above are the gate).
      - name: Simulator screenshots
        timeout-minutes: 15
        continue-on-error: true
        run: |
          APP=build/sim/Build/Products/Debug-iphonesimulator/HiChord.app
          mkdir -p shots
          DEVICES=$(xcrun simctl list devices available -j)
          PHONE=$(echo "$DEVICES" | jq -r '[.devices[][] | .name | select(test("^iPhone [0-9]+ Pro$"))] | sort | last // empty')
          PAD=$(echo "$DEVICES" | jq -r '[.devices[][] | .name | select(test("^iPad Pro"))] | sort | last // empty')
          # Runs a command with a time limit (macOS has no coreutils `timeout`).
          limit() {
            local secs="$1"; shift
            "$@" & local pid=$!
            local i=0
            while [ $i -lt "$secs" ]; do kill -0 $pid 2>/dev/null || { wait $pid; return $?; }; sleep 1; i=$((i + 1)); done
            echo "::warning::timed out after ${secs}s: $*"; kill $pid 2>/dev/null; return 124
          }
          shoot() {
            local device="$1" name="$2"; shift 2
            local udid
            udid=$(echo "$DEVICES" | jq -r --arg n "$device" '[.devices[][] | select(.name == $n)][0].udid // empty')
            if [ -z "$udid" ]; then echo "No simulator named $device"; return 0; fi
            case " $FAILED " in *" $udid "*) echo "Skipping $name ($device failed to boot)"; return 0;; esac
            xcrun simctl boot "$udid" || true
            limit 240 xcrun simctl bootstatus "$udid" -b >/dev/null || { echo "::warning::$device did not boot; skipping $name"; FAILED="$FAILED $udid"; return 0; }
            xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 || true
            xcrun simctl install "$udid" "$APP"
            xcrun simctl spawn "$udid" defaults write com.pocketaudio.hichord hichord.seenWelcome -bool "${WELCOME_SEEN:-YES}"
            # A hung launch would otherwise block forever (the simulator has no watchdog).
            limit 90 xcrun simctl launch --terminate-running-process "$udid" com.pocketaudio.hichord "$@" || echo "::error::launch did not complete ($name)"
            sleep 7
            xcrun simctl io "$udid" screenshot "shots/$name.png"
            # Fail if the app is no longer running (crash).
            if ! xcrun simctl spawn "$udid" launchctl list | grep -q com.pocketaudio.hichord; then
              echo "::error::App not running after launch ($name)"
              xcrun simctl spawn "$udid" log show --last 2m --predicate 'process == "HiChord"' | tail -120
              exit 1
            fi
          }
          FAILED=""
          shoot "$PHONE" iphone-portrait -uiDemo
          shoot "$PHONE" iphone-landscape -uiLandscape -uiDemo
          shoot "$PHONE" iphone-settings -uiSettings
          WELCOME_SEEN=NO shoot "$PHONE" iphone-guide
          if [ -n "$PAD" ]; then shoot "$PAD" ipad -uiDemo; fi
          # Fall back to another iPad if the first simulator failed to boot.
          if [ ! -f shots/ipad.png ]; then
            PAD2=$(echo "$DEVICES" | jq -r '[.devices[][] | .name | select(test("^iPad (Air|\\()"))] | sort | last // empty')
            if [ -n "$PAD2" ]; then shoot "$PAD2" ipad -uiDemo; fi
          fi
          ls -la shots

      - name: Publish screenshots to ci-screenshots branch
        if: always() && github.event_name == 'push'
        run: |
          ls shots/*.png >/dev/null 2>&1 || { echo "No screenshots to publish"; exit 0; }
          for f in shots/*.png; do sips -Z 1400 "$f" >/dev/null; done
          SRC_SHA=$(git rev-parse --short HEAD)
          mv shots "$RUNNER_TEMP/shots"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          # Rebuild the branch from scratch so it only ever holds the latest screenshots.
          git checkout -q --orphan screenshots-tmp
          git rm -rf -q --cached .
          cp "$RUNNER_TEMP"/shots/*.png .
          git add -f -- ':(glob)*.png'
          git commit -q -m "Screenshots for ${SRC_SHA}"
          git push -f origin HEAD:ci-screenshots

      - name: Warning summary
        if: always()
        run: |
          echo "=== Compiler warnings in project sources ==="
          cat build-*.log 2>/dev/null | grep -E "warning:" | grep -E "/(HiChord|HiChordCore)/" | sed -E 's#^.*/hichord/hichord/##' | sort -u || true
          echo "=== end ==="
